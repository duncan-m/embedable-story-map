  # 0.4.0
  - id: ESM-401
    title: Warn about map problems without failing CI
    activity: review
    release: v0-4
    status: shipped
    sources:
      - docs/plans/0.4.0-enhancements.md#1-groundwork-validator-warnings
    customer:
