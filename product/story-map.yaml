# yaml-language-server: $schema=../story-map.schema.json
version: 1
id: auto-story-map
title: Auto Story Map Demo
summary: How product teams set up, plan, review and follow their story map, from the first release to what comes next.
visibility: all-users
customer:
  title: Auto Story Map Demo
  summary: What you can do with Auto Story Map today, and what is coming next.
activities:
  - id: set-up
    title: Set up in a product
    summary: Install the package and serve the board behind the product’s sign-in.
    customer:
      title: Get started
  - id: plan
    title: Plan the map
    summary: Write activities, releases and stories in the YAML file, by hand or with an agent.
    customer:
      title: Plan your map
  - id: review
    title: Review changes
    summary: Check and summarise map changes in pull requests.
    customer:
      title: Review changes
  - id: explore
    title: Explore the board
    summary: Read the map, search it and open story details.
    customer:
      title: Explore the board
  - id: track
    title: Track delivery
    summary: See what changed, who changed it and what is stuck.
    customer:
      title: Follow progress
releases:
  - id: v0-1
    title: "0.1.0: First release"
    summary: The YAML format, the validator, audience views and the React board.
    notes: |
      A product can keep its story map in Git and show it at /story-map. Internal viewers see the full map; signed-in customers see only stories with approved customer copy.
    impact:
      - metric: Places the team tracks delivery
        expected: One map in the product repository instead of a separate planning tool
        solves: Plans drifting away from the code
        draft: true
    customer:
      title: "0.1.0"
  - id: v0-2
    title: "0.2.0: Engineering links"
    summary: Link stories to engineering docs, and give agents a first-run workflow.
    impact:
      - metric: Time to find the design behind a story
        expected: One click from the story to its engineering overview
        solves: Searching docs for the section that explains a story
        draft: true
    customer:
      title: "0.2.0"
  - id: v0-3
    title: "0.3.0: Board, search and history"
    summary: A new board with panels, search, change summaries, status history and npm publishing.
    notes: |
      The board became a grid of activity tiles and release lanes, with a detail panel for each story that works without client-side JavaScript.

      Pull requests get a summary of map changes, and the board shows when each story changed and who changed it.
    impact:
      - metric: Map changes reviewed in pull requests
        expected: Every map change shows a summary in its PR
        solves: Reviewers missing status and customer-facing changes in YAML diffs
        draft: true
    customer:
      title: "0.3.0"
  - id: v0-4
    title: "0.4.0: Delivery tracking"
    summary: Statuses for work that is merged, blocked or cut, release impact, stalled stories and “last updated” from Git.
    notes: |
      Teams can record why work stopped, what each release should change, and see which stories have been in progress too long.
    impact:
      - metric: Stories in progress for more than 4 weeks
        expected: Flagged on the board instead of found in stand-ups
        solves: Stuck work going unnoticed
        draft: true
      - metric: Releases with a stated expected impact
        expected: Every release with active stories
        solves: Releases planned without saying what they should change
        draft: true
    customer:
      title: "0.4.0"
  - id: v0-4-1
    title: "0.4.1: Filters apply as you choose"
    summary: An optional script applies the board’s filters as soon as they change, and the demo shows this library’s own map.
    impact:
      - metric: Steps to change a filter
        expected: One choice instead of a choice and a click on Apply
        solves: Viewers changing a filter and forgetting to apply it
        draft: true
    customer:
      title: "0.4.1"
  - id: v0-5
    title: "0.5.0: Collapsible releases and version footer"
    summary: Release lanes collapse to one line, and the board shows which version is running.
    impact:
      - metric: Scrolling past finished releases
        expected: Shipped releases collapse to one line and stay collapsed between visits
        solves: Long maps where the current release is far down the page
        draft: true
      - metric: Time to find which version a product runs
        expected: Read from the board’s footer, with a link to that version’s changelog
        solves: Checking the host’s lockfile to answer “do we have that fix?”
        draft: true
    customer:
      title: "0.5.0"
  - id: v0-6-1
    title: "0.6.1: Review and security fixes"
    summary: Fixes from the November 2026 code review, several of them for security, with one call to project and filter the map and a header that shows recent changes.
    impact:
      - metric: Known bugs and security risks from the code review
        expected: Fixed, or recorded as a decision, before 0.6.1 is published
        solves: Publishing a first version with known problems
        draft: true
  - id: export
    title: Export to external tools
    summary: Internal viewers download the map as a Visio or CSV file to import into Miro or Lucidchart.
    notes: |
      A one-way snapshot of the board for workshops and planning sessions held in other tools. The YAML file stays the source of truth.

      Exports include every lane, with collapsed lanes kept collapsed, and at most the 200 most recently changed stories.
    impact:
      - metric: Time to get the story map into Miro or Lucidchart
        expected: One download and an import, instead of copying cards by hand
        solves: Teams retyping the map to run a workshop in another tool
        draft: true
  - id: next
    title: Next
    summary: Proposed for 0.6.x or 0.7.0.
    impact:
      - metric: Map changes that are missing from feature PRs
        expected: Found by the weekly audit and proposed in a PR
        solves: The map drifting from the code when a PR forgets to update it
        draft: true
    customer:
      title: Coming next
stories:
  # 0.1.0
  - id: ESM-101
    title: Keep the map in a validated YAML file
    activity: plan
    release: v0-1
    status: shipped
    summary: One YAML file per product, with strict validation, size limits and stable story IDs.
    sources:
      - docs/ENGINEERING-OVERVIEW.md#the-map-file
    customer:
      title: Keep your map in your repository
      summary: Your story map is a YAML file reviewed and versioned with your code.
  - id: ESM-102
    title: Validate the map from the command line
    activity: review
    release: v0-1
    status: shipped
    sources:
      - docs/ENGINEERING-OVERVIEW.md#validate
    customer:
      title: Validate the map in CI
