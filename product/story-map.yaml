  # 0.6.1: fixes from the November 2026 code review
  - id: ESM-601
    title: Keep long Git names from breaking the history file
    activity: track
    release: v0-6-1
    status: shipped
    summary: story-map history truncates author and merger names to the history format's 120-character limit, so parseStoryMapHistory always accepts what it writes.
    sources:
      - docs/plans/0.6.0-review-fixes.md#2-history-names-that-fit-the-history-format
  - id: ESM-602
    title: Keep history and diffs working when the map format changes
    activity: track
    release: v0-6-1
    status: shipped
    summary: Past versions of the map are read leniently with a migration step, history reports versions it skipped, and diff compares an older-format base instead of failing.
    sources:
      - docs/plans/0.6.0-review-fixes.md#3-history-and-diff-that-survive-format-changes
  - id: ESM-603
    title: Use real IDs in the customer view
    activity: explore
    release: v0-6-1
    status: cut
    statusReason: Out of scope for this release. The customer view keeps its positional IDs, so customers see no internal IDs.
    summary: Would have kept the real activity, release and story IDs in the customer view, so a collapsed lane stays on the same release when other releases become visible.
    sources:
      - docs/plans/0.6.0-review-fixes.md#4-real-ids-in-the-customer-view-out-of-scope
  - id: ESM-604
    title: Make hosts choose who sees the internal map
    activity: set-up
    release: v0-6-1
    status: cut
    statusReason: The library is set up mainly for internal use, so the default engineer and super-admin rule stays. The risk is documented in the engineering overview instead.
    summary: Would have warned when the default engineer and super-admin rule was used, then required canViewInternal.
    sources:
      - docs/plans/0.6.0-review-fixes.md#5-the-default-rule-for-who-sees-the-internal-map-out-of-scope
      - docs/ENGINEERING-OVERVIEW.md#audience-projection
  - id: ESM-605
    title: Project and filter the map in one call
    activity: set-up
    release: v0-6-1
    status: shipped
    summary: getStoryMapPage projects for the viewer and then filters, and storyMapResponseHeaders gives the no-store headers, so the safe order is the easy one. Documents page sizes for large maps.
    sources:
      - docs/plans/0.6.0-review-fixes.md#6-one-call-that-projects-and-filters
  - id: ESM-606
    title: Fix CLI and source check edge cases
    activity: review
    release: v0-6-1
    status: shipped
    summary: Stop options taking the next flag as their value, and refuse sources that reach outside the repository through a symbolic link.
    sources:
      - docs/plans/0.6.0-review-fixes.md#7-cli-and-source-check-fixes
  - id: ESM-607
    title: Stop diff summaries notifying people
    activity: review
    release: v0-6-1
    status: shipped
    summary: The diff escapes @mentions and #references in map text, so pasting the summary into a PR does not notify people or link issues.
    sources:
      - docs/plans/0.6.0-review-fixes.md#8-diff-summaries-that-do-not-notify-people
  - id: ESM-608
    title: Keep the board working with bad date settings
    activity: explore
    release: v0-6-1
    status: shipped
    summary: An unknown locale or time zone falls back to defaults instead of failing the render, and date formatters are built once per render.
    sources:
      - docs/plans/0.6.0-review-fixes.md#9-a-board-that-survives-bad-date-settings
  - id: ESM-609
    title: See when the map last changed and where
    activity: track
    release: v0-6-1
    status: shipped
    summary: The internal board's header says when the map was last updated, by whom, and which releases most recent changes were in, instead of a fixed summary.
    sources:
      - docs/story-map.md#show-status-history
  - id: ESM-610
    title: Keep source checks fast on crafted headings
    activity: review
    release: v0-6-1
    status: shipped
    summary: Heading anchors are read in linear time, and Markdown files over 5 MB are not read for anchors, so a crafted heading in a PR cannot stall CI.
    sources:
      - docs/plans/0.6.0-review-fixes.md#11-source-checks-that-stay-fast
  # Export to external tools
  - id: ESM-701
    title: Check that Miro and Lucidchart import a test file
    activity: explore
    release: export
    status: merged
    summary: Import a hand-made Visio file and CSV into Miro, Lucidchart and LibreOffice before building the export, and record what survives.
    sources:
      - docs/plans/export-to-external-tools.md#1-check-that-miro-and-lucidchart-import-a-test-file
  - id: ESM-702
    title: Export the internal map as a Visio file
    activity: explore
    release: export
    status: merged
    summary: storyMapToVsdx writes the whole internal map as a .vsdx file, with collapsed lanes, release notes and impact, and at most 200 stories.
    notes: Hand-rolled stored zip, no new dependency. Refuses customer views. Includes the LibreOffice check in CI.
    sources:
      - docs/plans/export-to-external-tools.md#2-write-a-visio-file-from-the-internal-view
      - docs/plans/export-to-external-tools.md#6-check-exported-files-in-ci
  - id: ESM-703
    title: Export the map from the command line
    activity: explore
    release: export
    status: merged
    summary: story-map export writes a Visio or CSV file from the YAML file, optionally using history to choose the most recent stories.
    sources:
      - docs/plans/export-to-external-tools.md#3-export-from-the-command-line
  - id: ESM-704
    title: Download the export from the board
    activity: explore
    release: export
    status: merged
    summary: Internal viewers get Export links on the board when the host sets exportHref, and lanes they collapsed stay collapsed in the file.
    sources:
      - docs/plans/export-to-external-tools.md#4-download-the-export-from-the-board
  - id: ESM-705
    title: Export the map as CSV
    activity: explore
    release: export
    status: merged
    summary: One row per story with its activity, release, ID and title, safe to open in spreadsheets and importable into Miro and Lucidchart.
    sources:
      - docs/plans/export-to-external-tools.md#5-export-the-map-as-csv
  - id: ESM-414
    title: Choose several statuses in the filter
    activity: explore
    release: export
    status: merged
    summary: The status filter is a list of checkboxes with the active statuses ticked by default, so viewers can show any mix of statuses, including stalled stories, without an All option.
    notes: The URL repeats status once per choice, and status=all and single-status links still work. view.filter.status becomes an array, which is a breaking change for hosts that read it.
    sources:
      - docs/story-map.md#blocked-and-cut-stories
      - docs/ENGINEERING-OVERVIEW.md#filter-toolbar
