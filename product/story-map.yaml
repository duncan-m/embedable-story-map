  - id: ESM-403
    title: Record release notes and expected impact
    activity: plan
    release: v0-4
    status: shipped
    sources:
      - docs/story-map.md#release-notes-and-impact
    customer:
      title: Say what each release should change
      summary: Record release notes and the outcome each release is expected to change.
  - id: ESM-404
    title: Edit release notes and impact on the board
    activity: explore
    release: v0-4
    status: cut
    statusReason: The board stays read-only. Saving edits would need the map on a hosted service, so agents update notes and impact in pull requests instead.
    sources:
      - docs/plans/0.4.0-enhancements.md#not-editable-on-the-board
  - id: ESM-405
    title: Flag stories that stay in progress too long
    activity: track
    release: v0-4
    status: shipped
    sources:
      - docs/story-map.md#flag-stalled-stories
    customer:
      title: Spot work that has stalled
      summary: Stories in progress for longer than you choose are flagged on the board.
  - id: ESM-406
    title: Show who last updated a story, from Git
    activity: track
    release: v0-4
    status: shipped
    notes: Edits authored by bots are credited to whoever merged them.
    sources:
      - docs/plans/0.4.0-enhancements.md#5-last-updated-from-git
    customer:
      title: See who last updated a story
      summary: See who last changed a story and when, worked out from your repository.
  - id: ESM-407
    title: Separate merged work from shipped work
    activity: track
    release: v0-4
    status: shipped
    sources:
      - docs/story-map.md#merged-and-shipped
    customer:
      title: Tell finished work from released work
      summary: Mark work as merged when it is finished, and shipped when your users have it.
  # 0.4.1
  - id: ESM-411
    title: Apply filters as soon as they change
    activity: explore
    release: v0-4-1
    status: shipped
    summary: The optional board.js script submits the filter form when a select changes or Enter is pressed in search, hides Apply, and returns focus to the filter that was used.
    notes: Progressive enhancement only. Without the script, the form and its Apply button work as before.
    sources:
      - docs/story-map.md#integrate-with-a-product
      - docs/ENGINEERING-OVERVIEW.md#filter-toolbar
    customer:
      title: Filters apply as you choose them
      summary: Choose a filter and the board updates, with no Apply button.
  # 0.5.0
  - id: ESM-412
    title: Collapse release lanes
    activity: explore
    release: v0-5
    status: shipped
    summary: A chevron in each release header collapses the lane to its title and story count. It works without JavaScript, and board.js remembers collapsed lanes across reloads.
    notes: CSS :has() does the collapsing. Browsers without :has() do not show the toggle, so every lane stays open.
    sources:
      - docs/ENGINEERING-OVERVIEW.md#layout
      - docs/ENGINEERING-OVERVIEW.md#filter-toolbar
  - id: ESM-413
